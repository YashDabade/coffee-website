<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — FoodHub</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
</head>
<body class="page-cart">

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">
      <span class="logo-icon">🍔</span>
      <span class="logo-text">FoodHub</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Menu</a>
      <a href="setup-guide.html" class="nav-link" style="color:var(--accent);border:1px solid var(--border-accent);padding:0.3rem 0.8rem;border-radius:100px;font-size:0.78rem;">🗄️ Supabase Setup</a>
      <a href="cart.html" class="nav-link active cart-link">
        <span class="cart-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-badge" id="cart-badge">0</span>
        </span>
        Cart
      </a>
    </div>
  </nav>

  <main class="cart-main">
    <div class="container">
      <div class="cart-page-header">
        <a href="index.html" class="back-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          Back to Menu
        </a>
        <h1 class="cart-title">Your Cart</h1>
      </div>

      <!-- Empty Cart State -->
      <div class="empty-cart" id="empty-cart" style="display:none;">
        <div class="empty-cart-icon">🛒</div>
        <h2>Your cart is empty</h2>
        <p>Looks like you haven't added anything yet.</p>
        <a href="index.html" class="btn-primary">Browse Menu</a>
      </div>

      <!-- Cart Content -->
      <div class="cart-layout" id="cart-content">
        <div class="cart-items-section">
          <div class="cart-items-header">
            <span class="items-count" id="items-count">0 Items</span>
            <button class="clear-cart-btn" id="clear-cart-btn">Clear All</button>
          </div>
          <div class="cart-items-list" id="cart-items-list">
            <!-- Cart items injected here -->
          </div>
        </div>

        <!-- Order Summary -->
        <div class="order-summary">
          <h3 class="summary-title">Order Summary</h3>
          <div class="summary-rows">
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="subtotal">₹0</span>
            </div>
            <div class="summary-row">
              <span>Delivery Fee</span>
              <span id="delivery-fee">₹30</span>
            </div>
            <div class="summary-row">
              <span>Taxes (5%)</span>
              <span id="taxes">₹0</span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-row total-row">
              <span>Total</span>
              <span id="grand-total">₹0</span>
            </div>
          </div>

          <div class="promo-wrap">
            <input type="text" class="promo-input" id="promo-input" placeholder="Promo code" />
            <button class="promo-btn" id="promo-btn">Apply</button>
          </div>
          <p class="promo-hint" id="promo-hint"></p>

          <button class="btn-primary place-order-btn" id="place-order-btn">
            <span>Place Order</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
          <p class="secure-note">🔒 Secure checkout powered by FoodHub</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="toast-icon">✅</span>
    <span class="toast-msg" id="toast-msg">Item removed!</span>
  </div>

  <script src="supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
