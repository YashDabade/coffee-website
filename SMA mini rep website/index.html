<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodHub — Premium Food Ordering</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
</head>
<body class="page-menu">

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">
      <span class="logo-icon">🍔</span>
      <span class="logo-text">FoodHub</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link active">Menu</a>
      <a href="setup-guide.html" class="nav-link" style="color:var(--accent);border:1px solid var(--border-accent);padding:0.3rem 0.8rem;border-radius:100px;font-size:0.78rem;">🗄️ Supabase Setup</a>
      <a href="cart.html" class="nav-link cart-link">
        <span class="cart-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-badge" id="cart-badge">0</span>
        </span>
        Cart
      </a>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-bg-glow"></div>
    <div class="hero-content">
      <p class="hero-tag">🔥 Live Ordering</p>
      <h1 class="hero-title">Cravings, <span class="hero-accent">Delivered.</span></h1>
      <p class="hero-sub">Chef-crafted dishes, delivered fresh to your door in under 30 minutes.</p>
      <div class="hero-stats">
        <div class="stat"><span class="stat-num">50+</span><span class="stat-label">Menu Items</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><span class="stat-num">4.9★</span><span class="stat-label">Avg Rating</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><span class="stat-num">25min</span><span class="stat-label">Avg Delivery</span></div>
      </div>
    </div>
    <div class="hero-img-wrap">
      <div class="hero-plate-ring"></div>
      <div class="hero-plate-ring ring2"></div>
      <span class="hero-plate-emoji">🍽️</span>
    </div>
  </header>

  <!-- Category Filter -->
  <section class="categories-section">
    <div class="container">
      <div class="categories-scroll" id="categories">
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="burgers">🍔 Burgers</button>
        <button class="cat-btn" data-cat="pizza">🍕 Pizza</button>
        <button class="cat-btn" data-cat="biryani">🍛 Biryani</button>
        <button class="cat-btn" data-cat="rolls">🌯 Rolls</button>
        <button class="cat-btn" data-cat="chinese">🥡 Chinese</button>
        <button class="cat-btn" data-cat="desserts">🍰 Desserts</button>
        <button class="cat-btn" data-cat="drinks">🥤 Drinks</button>
      </div>
    </div>
  </section>

  <!-- Search Bar -->
  <section class="search-section">
    <div class="container">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search dishes, cuisines…" />
      </div>
    </div>
  </section>

  <!-- Menu Grid -->
  <main class="menu-section">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title" id="section-title">All Dishes</h2>
        <span class="section-count" id="section-count"></span>
      </div>
      <!-- Skeleton Loader -->
      <div class="menu-grid" id="skeleton-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
      <div class="menu-grid" id="menu-grid" style="display:none;"></div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="toast-icon">✅</span>
    <span class="toast-msg" id="toast-msg">Item added to cart!</span>
  </div>

  <script src="supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
