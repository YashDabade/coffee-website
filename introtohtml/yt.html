<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Exercise</title>
    <style>
        .thumbnail {
            width: 300px;
            display: block;


        }

        .Searchbar {

            display: block;

        }





        .video-author,
        .video-stats {
            display: block;
        }

        .vid-preview {
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
        }

        .channelpics {
            display: inline-block;
            width: 50px
        }

        .videoinfo {
            display: inline-block;
            width: 200px;

        }
    </style>

</head>

<body>
    <input class="Searchbar" type="text" placeholder="Search">

    <div class="vid-preview">
        <div>
            <img class="thumbnail" src="thumbnails/thumbnail-1.webp" alt="">
        </div>



        <div>
            <div>
                <img src="channelpics/channel-1.jpeg" alt="">
            </div>

            <div class="videoinfo">
                <p class="video-title"> Talking Tech and AI with Google CEO Sundar Pichai!</p>
                <p class="video-author">Markques</p>
                <p class="video-stats">3.4mil views &#183; 6months ago</p>
            </div>

        </div>




    </div>

    <div class="vid-preview">
        <div>
            <img class="thumbnail" src="thumbnails/thumbnail-2.webp" alt="">
        </div>
        <div>
            <p class="video-title"> Try not to laugh challenge#9</p>
            <p class="video-author">Markipiler</p>
            <p class="video-stats">9.4mil views &#183; 4Years ago</p>
        </div>



    </div>
</body>

</html>
